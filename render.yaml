services:
  - type: web
    name: canteen-license
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    pythonVersion: "3.12"
    disk:
      path: /data
      sizeGB: 1
    envVars:
      - key: LICENSE_DB_PATH
        value: /data/license.db
      - key: PYTHON_VERSION
        value: "3.12"
